        function calcBudget() {
            let tbody = document.getElementById('budget-tbody');
            let resultDiv = document.getElementById('budget-result');
            if(!tbody || !resultDiv) return;

            let totalTWD = 0; let sharedTotalTWD = 0;
            let balancesShared = {};
            payers.forEach(p => balancesShared[p] = 0);

            let rows = tbody.querySelectorAll('tr');
            rows.forEach(tr => {
                let payer = tr.querySelector('.payer-select').value;
                let splitType = tr.querySelector('.split-select').value;
                let curr = tr.querySelector('.curr-select').value;
                let amount = parseFloat(tr.querySelector('.amount-input').value.replace(/,/g, '')) || 0;
                
                let rate = allRatesToTWD[curr] || 1;
                if (curr === 'TWD') rate = 1;
                let twdAmount = amount * rate;

                totalTWD += twdAmount;

                // 只有選擇「平分」的項目才會進入公費池計算
                if (splitType === '平分' && balancesShared[payer] !== undefined) {
                    sharedTotalTWD += twdAmount;
                    balancesShared[payer] += twdAmount;
                }
            });

            if (payers.length === 0) { resultDiv.innerHTML = '請先新增付款人！'; return; }

            let avgShared = sharedTotalTWD / payers.length;
            let settleText = `<div style="font-size:13px; font-weight:800; margin-bottom:8px; color:var(--primary-color);">結算金額 (約略 NT$)</div>`;
            settleText += `<div style="font-size:11px; margin-bottom:8px;">總支出：$${Math.round(totalTWD).toLocaleString()} (公費：$${Math.round(sharedTotalTWD).toLocaleString()})</div>`;

            let debtors = []; let creditors = [];
            payers.forEach(p => {
                let diff = balancesShared[p] - avgShared;
                if (diff > 1) creditors.push({name: p, amount: diff});
                else if (diff < -1) debtors.push({name: p, amount: -diff});
            });

            if (debtors.length === 0 && creditors.length === 0) {
                settleText += `<div style="color:#10b981; font-weight:800; font-size:12px;">✅ 目前公費無欠款，大家互不相欠！</div>`;
            } else {
                debtors.sort((a,b)=>b.amount - a.amount);
                creditors.sort((a,b)=>b.amount - a.amount);
                
                let i=0, j=0;
                while(i < debtors.length && j < creditors.length) {
                    let d = debtors[i]; let c = creditors[j];
                    let settle = Math.min(d.amount, c.amount);
                    settleText += `<div style="background:rgba(220,38,38,0.05); padding:6px 10px; border-radius:8px; margin-bottom:4px; font-size:12px;"><span style="color:var(--danger-color); font-weight:800;">${d.name}</span> 應給 <span style="color:#0284c7; font-weight:800;">${c.name}</span> $${Math.round(settle).toLocaleString()}</div>`;
                    d.amount -= settle; c.amount -= settle;
                    if(d.amount < 1) i++;
                    if(c.amount < 1) j++;
                }
            }
            resultDiv.innerHTML = settleText;
        }

// 🌟 強制攔截貼上事件：只允許貼上「純文字」，防止外部網頁的字體大小、顏色或 HTML 標籤破壞排版
        document.addEventListener('paste', function(e) {
            // 確保只有在「可編輯區域 (contenteditable)」貼上時才觸發過濾
            if (e.target.isContentEditable) {
                e.preventDefault(); // 阻擋預設的「帶格式貼上」行為
                // 抓取剪貼簿裡的「純文字」版本
                let text = (e.clipboardData || window.clipboardData).getData('text/plain');
                // 將純文字安插進目前的游標位置
                document.execCommand('insertText', false, text);
            }
        });
        window.onload = loadData;
// 🌟 處理核取方塊切換，並支援唯讀模式下的延遲存檔例外
        function toggleComplete(item, event) {
            // 🌟 核心防護 1：抓取真實點擊事件，如果系統漏發事件，寧可不動作也不要誤判
            let e = event || window.event;
            if (!e) return; 

            // 🌟 核心防護 2：鎖定點擊的「最底層元素」
            let target = e.target || e.srcElement;
            if (!target) return;

            // 🌟 核心防護 3：嚴格比對，只有精準點在「圈圈」或「圈圈外框」才放行
            let isCheckbox = target.classList.contains('custom-checkbox') || target.closest('.checkbox-wrapper');
            if (!isCheckbox) {
                return; // 點到空白處、文字、按鈕等，一律直接中斷！絕對不打勾！
            }
            
            // 通過層層安檢，執行打勾
            item.classList.toggle('completed');
            
            // 延遲存檔：讓使用者能快速連續打勾，3秒後再一次性背景儲存
            clearTimeout(item.saveTimeout);
            item.saveTimeout = setTimeout(() => {
                if (typeof saveData === 'function') {
                    if (!isEditMode) {
                        forceSaveCheckboxState();
                    } else {
                        saveData();
                    }
                }
            }, 3000);
        }        // 🌟 專為唯讀模式設計的背景無感存檔
        function forceSaveCheckboxState() {
            // 如果是分享出去的純唯讀網址 (帶有 readonly 參數) 則完全不存檔
            if (new URLSearchParams(window.location.search).get('readonly')) return; 
            
            try {
                // 擷取當前打勾後的畫面狀態
                const state = captureState();
                let newCompressed = LZString.compressToUTF16(JSON.stringify(state));
                
                // 如果內容沒變就不浪費資源上傳
                if (newCompressed === lastCloudDataHash) return;
                
                // 提前更新本地 Hash 避免重新載入畫面導致回彈
                lastCloudDataHash = newCompressed; 
                
                // 背景靜默更新到 Firebase，不觸發解鎖機制
                tripRef.update({
                    compressedData: newCompressed,
                    lastModified: Date.now()
                }).then(() => {
                    console.log("✅ 核取狀態已在背景更新至雲端");
                });
            } catch(e) {
                console.error("核取狀態儲存失敗", e);
            }
        }
    </script>

    <script>
    // 🌟 徹底繞過 iOS Safari 的連字圖示相容性問題：改用真正的 Unicode 碼位
    (function() {
        fetch('https://cdn.jsdelivr.net/gh/google/material-design-icons@master/font/MaterialIconsRound-Regular.codepoints')
            .then(res => res.text())
            .then(text => {
                const map = {};
                text.trim().split('\n').forEach(line => {
                    const parts = line.trim().split(' ');
                    if (parts.length === 2) map[parts[0]] = String.fromCodePoint(parseInt(parts[1], 16));
                });
                function applyIcons(root) {
                    root.querySelectorAll('.material-icons-round').forEach(el => {
                        const name = el.textContent.trim();
                        if (map[name]) el.textContent = map[name];
                    });
                }
                applyIcons(document);
                new MutationObserver(muts => {
                    muts.forEach(m => m.addedNodes.forEach(node => {
                        if (node.nodeType === 1) {
                            if (node.classList && node.classList.contains('material-icons-round')) {
                                const name = node.textContent.trim();
                                if (map[name]) node.textContent = map[name];
                            }
                            applyIcons(node);
                        }
                    }));
                }).observe(document.body, { childList: true, subtree: true });
            });
    })();
    </script>
